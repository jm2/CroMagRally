name: Full Compile Check

# Run automatically on pull requests and pushes to master so compile breakage is caught
# in CI (Linux x86_64/ARM64, Windows VS2022, macOS, Apple mobile and Android), plus
# manual dispatch for ad-hoc checks.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

# Minimal token: this workflow only reads the code it builds.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes) to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-wrapper-check:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Validate the wrapper we execute. SDL's sample Android project is not part
      # of our build; leave submodules uninitialized in this validation checkout.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  full-compile-check:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        platform:
          # The GCC job also exercises the common CPack/FHS install path with DEB and RPM.
          - { name: Linux/GCC, os: ubuntu-latest, packageflags: "--deb" }
          - { name: Linux/Clang, os: ubuntu-latest, prefix: "CC=clang CXX=clang++"}
          - { name: Linux/ARM64, os: ubuntu-24.04-arm }
          - { name: Windows/VS2022, os: windows-2022, extraflags: "-G 'Visual Studio 17 2022'" }
          - { name: Mac, os: macos-latest }

    steps:
      # Linux jobs compile the pinned extern/SDL3 submodule. These are its optional
      # backend dependencies, matching the release AppImage job.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {submodules: 'recursive'}

      - name: Install RPM packaging tool
        if: matrix.platform.name == 'Linux/GCC'
        run: sudo apt install -y rpm

      - run: ${{matrix.platform.prefix}} python3 build.py --dependencies --configure --build ${{matrix.platform.packageflags}} ${{matrix.platform.extraflags}}

      - name: Verify native Linux packages
        if: matrix.platform.name == 'Linux/GCC'
        run: |
          test -s ../dist/*.deb
          cpack -G RPM --config CPackConfig.cmake
          test -s ./*.rpm
        working-directory: build

      - name: Run validation tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Run validation tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Run validation tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --no-tests=error

      - name: Configure sanitizer validation tests
        if: matrix.platform.name == 'Linux/GCC'
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_SDL_FROM_SOURCE=ON -DSANITIZE=ON

      - name: Run sanitizer validation tests
        if: matrix.platform.name == 'Linux/GCC'
        run: |
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure --no-tests=error

      - name: Smoke every CLI race track with sanitizers
        if: matrix.platform.name == 'Linux/GCC'
        run: python3 Tests/StartupSmokeTests.py build-sanitize/CroMagRally

      # Six real game instances on loopback (host + five clients, direct join): the only
      # check that exercises HUD and network state for high player numbers end to end.
      - name: Race six LAN players with sanitizers
        if: matrix.platform.name == 'Linux/GCC'
        run: python3 Tests/NetworkSmokeTests.py build-sanitize/CroMagRally 6 --frames 300

      - name: Reject malformed playfield and skeleton fixtures with sanitizers
        if: matrix.platform.name == 'Linux/GCC'
        run: python3 Tests/MalformedAssetTests.py build-sanitize/CroMagRally

  # Debian provides a packaged SDL3, allowing dpkg-shlibdeps to resolve the
  # external runtime and tests to inspect both supported DEB layouts, then
  # install each one and race a few headless frames through its launcher.
  debian-sdl-packaging:
    name: Debian SDL packaging
    runs-on: ubuntu-latest
    container: debian:trixie-slim@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f
    timeout-minutes: 20
    env:
      TMPDIR: /var/tmp
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ git python3 \
            dpkg-dev file libsdl3-dev libgl-dev ca-certificates \
            libegl1 libegl-mesa0 libgl1-mesa-dri   # SDL's offscreen driver for the installed smoke
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {submodules: 'recursive'}
      - name: Build, inspect and install bundled and external SDL packages
        run: |
          cmr_build="${TMPDIR:-/var/tmp}/cmr-debian"
          cmake -S . -B "$cmr_build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SDL_FROM_SOURCE=OFF -DCMR_INSTALL=ON -DCMR_BUNDLE_SDL=OFF
          cmake --build "$cmr_build" --parallel 2
          ctest --test-dir "$cmr_build" --output-on-failure --no-tests=error
          cpack -G DEB --config "$cmr_build/CPackConfig.cmake" -B "$cmr_build/packages/system"
          cmake -S . -B "$cmr_build" -DCMR_BUNDLE_SDL=ON
          cpack -G DEB --config "$cmr_build/CPackConfig.cmake" -B "$cmr_build/packages/bundled"
          # Install into a system without the SDL build packages and the libraries they
          # pulled in, so each package's own Depends must bring in what it needs.
          apt-get purge -y --auto-remove libsdl3-dev libsdl3-0
          python3 Tests/DebianPackageTests.py --install "$cmr_build"/packages/bundled/*.deb "$cmr_build"/packages/system/*.deb

  # Exercise both release device builds and the developer scripts' simulator defaults.
  apple-mobile-check:
    name: Apple mobile (${{ matrix.target.name }}, ${{ matrix.destination }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        destination: [device, simulator]
        target:
          - { name: iOS, script: build_ios.sh }
          - { name: tvOS, script: build_tvos.sh }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {submodules: 'recursive'}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Compile unsigned ${{ matrix.target.name }} ${{ matrix.destination }} app
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: ./${{ matrix.target.script }} ${{ matrix.destination }}

  # Arch/Flatpak and Windows ARM64 remain release gates: each needs its own full build
  # environment and would duplicate the expensive SDL/game compile. Linux ARM64 covers
  # native ARM code generation here, while DEB+RPM cover the shared CPack/FHS package path.

  # The desktop matrix above can't catch breakage in the Android NDK build or the mobile
  # branches of the shared CMakeLists, which otherwise only surface at release-tag time.
  # Build device/debug and emulator/release APKs so both packaging variants are checked.
  android-native-check:
    needs: gradle-wrapper-check
    name: Android APK (${{ matrix.target.abi }}, ${{ matrix.target.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { abi: arm64-v8a, variant: Debug }
          - { abi: x86_64, variant: Release }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {submodules: 'recursive'}   # extern/Pomme + extern/SDL3 + extern/gl4es

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform, build-tools and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build Android ${{ matrix.target.variant }} APK
        env:
          ABIS: ${{ matrix.target.abi }}
          GRADLE_TASK: assemble${{ matrix.target.variant }}
        run: ./build_android.sh

      - name: Lint Android package
        run: ./gradlew lint${{ matrix.target.variant }}
        working-directory: AndroidBuild
